name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 取得程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 修正環境與升級 pip
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools wheel

    - name: 安裝相依套件與 PyInstaller
      run: |
        pip install openai-whisper pyinstaller

    - name: 開始打包成 EXE
      run: |
        pyinstaller --noconsole --onefile whisper_gui.py

    - name: 上傳打包好的 EXE 檔案
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/*.exe
