name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 取得程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 升級 pip 與基本工具
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools wheel

    - name: 安裝 PyTorch (CPU版)
      run: |
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

    - name: 安裝 Whisper 與打包工具
      run: |
        pip install openai-whisper pyinstaller

    - name: 開始打包成 EXE
      run: |
        pyinstaller --noconsole --onefile --collect-all whisper --collect-all torch whisper_gui.py

    - name: 上傳打包好的 EXE 檔案
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/*.exe
