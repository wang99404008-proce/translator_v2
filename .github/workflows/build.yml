name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 檢出程式碼 (Checkout)
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install openai-whisper torch torchaudio pyinstaller

    - name: 執行 PyInstaller 打包
      run: |
        pyinstaller build.spec

    - name: 上傳打包好的執行檔
      uses: actions/upload-artifact@v4
      with:
        name: whisper_gui_v2_windows
        path: dist/whisper_gui_v2/
